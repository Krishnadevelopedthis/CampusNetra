    <meta name="keywords" content="smart campus, facility management, digital twin, work orders, issue tracking, predictive maintenance, campus operations" />

    <meta property="og:description" content="Manage campus facilities from one place with issue tracking, work orders, digital twins, inspections, and proactive maintenance." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CampusNetra" />
    <meta property="og:image" content="https://campusnetra.dpdns.org/logo-dark.svg" />

    <!-- Campus Netra logo favicon -->
    <link rel="icon" href="/logo-dark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm up the API connection (TLS handshake) while the JS bundle downloads. -->
    <link rel="preconnect" href="https://campusnetra.onrender.com" crossorigin />
    <!-- Font CSS loads without blocking first paint (display=swap shows text immediately). -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" /></noscript>
    <title>CampusNetra | Campus facility management software</title>
    <script>
      // Runs before the first paint to prevent theme flash on load.
      // User color theme is intentionally NOT loaded from localStorage — it resets
      // to default on each new session. User must re-select in Settings.
      (function () {
        try {
          var saved = localStorage.getItem('cn-theme')
          var mode = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = mode
          document.documentElement.dataset.userColorTheme = '#f4602a'

          if (mode === 'dark') {
            document.querySelector('meta[name="theme-color"]').content = '#141418'
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.userColorTheme = '#f4602a'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
