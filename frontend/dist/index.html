    <script>
      // Runs before the first paint to prevent theme flash on load.
      // User color theme is intentionally NOT loaded from localStorage — it resets
      // to default on each new session. User must re-select in Settings.
      (function () {
        try {
          var saved = localStorage.getItem('cn-theme')
          var mode = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = mode
          document.documentElement.dataset.userColorTheme = '#1e1b4b'

          if (mode === 'dark') {
            document.querySelector('meta[name="theme-color"]').content = '#0b1220'
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.userColorTheme = '#1e1b4b'
        }
      })()
    </script>
