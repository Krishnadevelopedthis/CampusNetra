<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Campus Netra · Offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f3f0; --ink: #1c1917; --muted: #6b6560; --brand: #f4602a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141418; --ink: #f4f3f0; --muted: #a8a29e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 0 auto 24px; max-width: 280px; color: var(--muted); line-height: 1.5; font-size: 15px; }
    button { border: 0; border-radius: 12px; padding: 12px 28px; font-size: 15px; font-weight: 600;
             background: var(--brand); color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="logo-dark.svg" alt="Campus Netra" />
    <h1>You're offline</h1>
    <p>Campus Netra needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.href='https://campusnetra.dpdns.org/login'">Try again</button>
  </main>
</body>
</html>
